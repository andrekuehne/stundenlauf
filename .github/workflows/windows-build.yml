name: Windows build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --group dev

      - name: PyInstaller (onedir)
        run: uv run build_windows --noconfirm

      - name: Installer version from tag
        shell: bash
        run: echo "INST_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc /DMyAppVersion="$env:INST_VERSION" installer\Stundenlauf.iss

      - name: Create portable zip
        shell: pwsh
        run: |
          $zipName = "Stundenlauf-${env:INST_VERSION}-portable.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "win_bundle/dist/Stundenlauf/*" -DestinationPath $zipName

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: stundenlauf-setup-${{ env.INST_VERSION }}
          path: installer/output/*-Setup.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: stundenlauf-portable-${{ env.INST_VERSION }}
          path: Stund*portable.zip

      - name: Create release if missing
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --generate-notes
          }

      - name: Upload installer to release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:GITHUB_REF_NAME installer/output/*-Setup.exe --clobber

      - name: Upload portable zip to release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:GITHUB_REF_NAME Stundenlauf-${env:INST_VERSION}-portable.zip --clobber