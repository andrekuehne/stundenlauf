[project]
name = "stundenlauf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pywebview>=5.4",
    "pytest>=9.0.3",
    "reportlab>=4.4.10",
    "pypdf>=6.10.0",
]

[project.scripts]
stundenlauf_gui = "main:stundenlauf_gui"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
