[project]
name = "stundenlauf"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pywebview>=5.4",
    "pytest>=9.0.3",
    "reportlab>=4.4.10",
    "pypdf>=6.10.0",
    "ipykernel>=7.2.0",
]

[project.scripts]
gui = "main:stundenlauf_gui"
build_windows = "win_bundle.build:main"
pdftest = "backend.export.pdftest_cli:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyinstaller>=6.19.0",
    "ruff>=0.15.10",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*", "win_bundle*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length — not previously enforced; revisit later
    "RUF001",  # ambiguous unicode in strings (German text is intentional)
    "RUF002",  # ambiguous unicode in docstrings (German text is intentional)
    "RUF003",  # ambiguous unicode in comments (German text is intentional)
    "SIM108",  # if-else-block-instead-of-if-exp — often less readable
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "T201"]
"docs/*" = ["E402", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend", "win_bundle"]
